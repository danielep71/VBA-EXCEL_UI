# Dependabot proposes updates to the GitHub Actions in .github/workflows/,
# which are pinned to full commit SHAs. Each update keeps the SHA pin and its
# exact version comment. Nothing merges automatically: I review every update,
# and the pull request's own CI run shows its effect.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Europe/Rome
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
