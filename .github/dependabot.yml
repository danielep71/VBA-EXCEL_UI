# Dependabot proposes updates to the GitHub Actions pinned by full commit SHA
# in .github/workflows/. Each pull request keeps the SHA pin and its exact
# version comment, so the workflow pin policy in tools/check_repo.py still
# applies. Nothing merges automatically: I review every update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Europe/Rome
    target-branch: main
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
