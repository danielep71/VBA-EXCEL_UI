name: Issue triage
run-name: "Issue triage — ${{ github.event_name }} by ${{ github.actor }}"

# Audits every open issue against the rules issue forms cannot enforce:
# assignee, exactly one priority, P1 only on bugs, an open milestone, a
# target end date before that milestone's due date, a dependency section,
# catalogue labels, and `blocked` exactly while a named prerequisite is
# unresolved.
# Read-only: it never changes an issue. A failed run is the triage signal;
# I resolve each finding by hand (docs/ISSUE_LABELS.md).
# Issue events run the workflow from the default branch only.

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
  # Triage compares each issue with its milestone's state and due date.
  milestone:
    types:
      - edited
      - closed
      - opened
      - deleted
  workflow_dispatch:

permissions:
  contents: read

# One global group: each run re-audits every open issue, so when a burst of
# issue events queues several runs, only the latest needs to finish.
concurrency:
  group: issue-triage
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit open issues
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      # Without it the issues API omits pull requests, and a dependency
      # section naming one is reported as a missing issue.
      pull-requests: read
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the triggering ref (the default branch on issue and milestone events)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Audit open issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/check_issues.py
          --repository "$GITHUB_REPOSITORY"
          --output test-results/issue-triage.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
