name: Release

# Publishes the GitHub release for a pushed vX.Y.Z tag, using
# tools/release.py for every decision:
#
# 1. verify: the tag is annotated and equals VERSION at the tagged commit,
#    CHANGELOG.md there has a dated section for the version, the commit is
#    reachable from main, and the required check "Repository and module
#    checks" concluded success on that exact commit;
# 2. bundle: git archive of the tag as .zip and .tar.gz, which honours the
#    export-ignore attributes, plus SHA256SUMS;
# 3. publish: creates the release from the tag with the changelog section as
#    its notes and the bundle as its assets, marked as a pre-release when the
#    version has a pre-release suffix, then checks the published release
#    against all three.
#
# Excel certification and the evidence record stay manual and happen before
# the tag is pushed (RELEASING.md); nothing here can run VBA.
#
# A manual run takes an existing tag and runs verify and notes only. It never
# builds or publishes anything.
#
# Only the publish job can write: contents: write, to create the release. The
# other jobs read. Actions are pinned by full commit SHA, as in every workflow
# here, and the release is created with the preinstalled gh client rather than
# a third-party action.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to verify, such as v1.1.3. Nothing is published.
        required: true
        type: string

permissions: {}

env:
  # The tag reaches the scripts through the environment, never through an
  # expression inside a script. tools/release.py rejects any other form.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read

    steps:
      # The full history and every tag: the tag must be annotated, and its
      # commit must be reachable from origin/main.
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'

      - name: Verify the tag, VERSION, CHANGELOG.md, main and the required check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release.py verify "$TAG" --repository "$GITHUB_REPOSITORY"

      # Runs even when verify failed, so a manual run always shows the notes.
      - name: Show the release notes
        if: ${{ !cancelled() }}
        run: |
          python3 tools/release.py notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "## Release notes for $TAG"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Build the source archives
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'

      - name: Build the archives and SHA256SUMS from the tag
        run: python3 tools/release.py bundle "$TAG" --out "$RUNNER_TEMP/dist"

      - name: Keep the bundle for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs:
      - verify
      - bundle
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'

      - name: Fetch the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/dist

      - name: Check the bundle against SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Write the release notes
        run: python3 tools/release.py notes "$TAG" > "$RUNNER_TEMP/release-notes.md"

      # gh uploads the assets to a draft and publishes the release only once
      # every upload has finished. A version with a pre-release suffix, such
      # as v1.2.0-rc.1, is published as a GitHub pre-release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "$(python3 tools/release.py is-prerelease "$TAG")" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${prerelease[@]}" \
            --title "VBA Excel UI ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP"/dist/*

      - name: Verify the published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/release.py verify-published "$TAG"
          --repository "$GITHUB_REPOSITORY"
          --dir "$RUNNER_TEMP/dist"
